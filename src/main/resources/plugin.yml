name: RaskolNPC
version: ${version}
main: ru.raskolnpc.RaskolNPC
api-version: '26.2'
description: Persistent NPC framework for a Paper-based Minecraft RPG server.
authors: [cryandprixlop]
softdepend: [Towny]
libraries:
  - org.xerial:sqlite-jdbc:3.54.1.0

commands:
  raskolnpc:
    description: NPC management commands.
    usage: /raskolnpc <create|list|info|delete|guard|resident>
    aliases: [rnpc]

permissions:
  raskolnpc.admin:
    description: Allows full administrative control over RaskolNPC.
    default: op
