# General RaskolNPC settings
debug: false

limits:
  guards-per-nation: 30
  residents-per-town: 15
  companions-per-player: 3
  total-npcs: 150

guards:
  # Hiring and daily rent are charged to the bank of the placement town.
  base-hire-cost: 100.0
  base-daily-rent: 10.0
  # A guard is dismissed after this many consecutive missed daily payments.
  maximum-debt-days: 3
  # Must match a nation rank already configured in Towny; RaskolNPC never creates ranks.
  towny-general-rank: general
  # Maximum number of guard orders advanced in one scheduler pass.
  order-batch-size: 6
  # Horizontal/vertical movement step used by the shared guard order controller.
  movement-step: 0.6

integrations:
  towny:
    enabled: true
    # Towny is optional. When it is installed, residents must be created
    # inside a town by its mayor, a town assistant, or an administrator.

performance:
  # NPC decisions are event-driven and periodically scheduled.
  decision-interval-ticks: 20

entities:
  # Physical entities are persistent and tagged with their RaskolNPC UUID.
  # AI is disabled until the relevant NPC behavior module is enabled.
  track-loaded-chunks: true

resident-behavior:
  # One shared timer handles all residents; never create a task per NPC.
  interval-ticks: 10
  # Maximum residents advanced in one timer invocation.
  batch-size: 8
  # Maximum horizontal movement distance per processed resident, in blocks.
  movement-step: 0.8

resident-business-stock:
  # Percentage of each business stock capacity consumed at every in-game day boundary.
  # Set to 0 to disable automatic consumption.
  daily-consumption-percent: 10
