# General RaskolNPC settings
debug: false

limits:
  guards-per-nation: 30
  residents-per-town: 15
  companions-per-player: 3
  total-npcs: 150

performance:
  # NPC decisions are event-driven and periodically scheduled.
  decision-interval-ticks: 20

entities:
  # Physical entities are persistent and tagged with their RaskolNPC UUID.
  # AI is disabled until the relevant NPC behavior module is enabled.
  track-loaded-chunks: true
