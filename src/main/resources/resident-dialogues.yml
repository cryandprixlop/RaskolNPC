# Resident conversations. Edit these lines without recompiling the plugin.
# Supported colors use '&' codes.
greetings:
  - "&fЗдравствуй, путник."
  - "&fДобрый день. Рад встрече."
  - "&fПриветствую тебя в нашем городе."

traits:
  FRIENDLY:
    - "&aВсегда рад новым знакомствам!"
  INTROVERTED:
    - "&7Я не очень разговорчив, но рад, что ты заглянул."
  GENEROUS:
    - "&aЕсли понадобится помощь, постараюсь выручить."
  CAUTIOUS:
    - "&eВ последнее время в городе неспокойно. Будь осторожен."
  CURIOUS:
    - "&bСкажи, какие новости ты принёс из дальних земель?"
  HARD_WORKING:
    - "&eРаботы много, но я не привык отступать."
  DISCIPLINED:
    - "&fПорядок и труд — основа хорошего города."
  LAZY:
    - "&7Сегодня бы выдался денёк поспокойнее..."

professions:
  FARMER:
    - "&aНа полях хороший урожай. Могу поделиться советом по земледелию."
  MINER:
    - "&7Я могу помочь с поставкой железа."
    - "&7В шахтах сейчас неплохая добыча. Если нужны ресурсы — поговорим."
  LUMBERJACK:
    - "&6Знаю, где найти хороший лес. Древесины обычно хватает."
  FISHERMAN:
    - "&bУлов сегодня хороший. На рынке свежая рыба."
  BLACKSMITH:
    - "&8Кузница работает с рассвета. Могу подсказать по инструментам."
  CRAFTSMAN:
    - "&eИз простых материалов можно сделать полезные вещи."
  MERCHANT:
    - "&aЕсли ищешь товары, загляни на городской рынок."
  BUILDER:
    - "&fГороду всегда нужны крепкие стены и умелые руки."
  COOK:
    - "&6После долгой дороги не помешает горячая еда."
  TEACHER:
    - "&bЗнания ценнее золота. Всегда есть чему научиться."
